name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: cd taskmanager && coverage run manage.py test -v 1 && coverage report
      - run: PYTHON=python scripts/smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskmanager:ci .
      - name: container answers /health/
        run: |
          docker run -d --rm --name taskmanager -p 8000:8000 taskmanager:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health/ && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health/
          docker stop taskmanager
